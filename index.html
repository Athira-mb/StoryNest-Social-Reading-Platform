<style>

.nav{max-width:1180px;margin:auto;display:flex;align-items:center;gap:22px;padding:15px 20px}.brand{font:700 28px "Playfair Display";color:var(--green);white-space:nowrap;letter-spacing:.02em}.navlinks{display:flex;gap:18px;flex:1}.navlinks button{border:0;background:none;color:#5e584f;font-weight:600}.navlinks button:hover{color:var(--green)}.search{width:210px;border:1px solid var(--line);border-radius:25px;padding:10px 14px;background:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#4c765d,#2a4736);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 8px 18px rgba(53,88,66,.25)}

.btn{border:0;border-radius:24px;padding:12px 18px;font-weight:700;transition:transform .2s ease,box-shadow .2s ease}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#4a725d,#2e4a3c);color:#fff;box-shadow:0 12px 20px rgba(64,106,82,.2)}.soft{background:var(--green2);color:var(--green)}.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}
section{margin-top:38px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:17px}.sectionHead h2{font:700 29px "Playfair Display";margin:0}.sectionHead span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 9px 26px rgba(52,41,35,.08)}.cover{height:165px;display:flex;align-items:flex-end;justify-content:flex-start;padding:17px 16px;text-align:left;color:#fff;font:700 21px "Playfair Display";background-size:cover;background-position:center;position:relative;overflow:hidden;letter-spacing:.02em;line-height:1.1;text-shadow:0 4px 16px rgba(0,0,0,.25)}.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,22,18,.06),rgba(23,19,14,.52));}.cover > *{position:relative;z-index:1}.cardBody{padding:15px}.card h3{font:700 19px "Playfair Display";margin:0 0 4px}.author{font-size:13px;color:var(--muted)}.meta{display:flex;justify-content:space-between;margin:10px 0;font-size:13px}.stars{color:#b08a50}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:8px 10px}
.card{transition:transform .25s ease,box-shadow .25s ease}.card:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(52,41,35,.14)}.cover{transition:filter .25s ease}.card:hover .cover{filter:saturate(1.12)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(64,106,82,.35);outline-offset:2px}
.discoverFilters{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.discoverFilters label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.discoverFilters select{min-width:170px;width:auto;padding:10px 34px 10px 12px;color:var(--ink);background:#fff}.discoverFilters input{min-width:210px;width:auto;padding:10px 14px}.discoverCount{margin-left:auto;color:var(--muted);font-size:13px}
.authLayout{max-width:960px;margin:28px auto;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--paper);box-shadow:var(--shadow);min-height:530px}.authArt{display:flex;flex-direction:column;justify-content:flex-end;padding:38px;color:#fff;background:linear-gradient(0deg,rgba(30,35,27,.75),rgba(30,35,27,.06)),url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1000&q=80') center/cover}.authArt h1{font:700 42px/1.05 "Playfair Display";margin:0 0 10px}.authArt p{line-height:1.6;margin:0}.authForm{align-self:center;padding:42px}.authForm h2{font:700 32px "Playfair Display";margin:0 0 8px}.authForm>p{color:var(--muted);margin:0 0 24px}.authForm .formrow{margin:14px 0}.authForm .btn{width:100%;margin-top:8px}.authLinks{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.textButton{border:0;background:none;padding:0;color:var(--green);font-weight:700}.authNotice{padding:12px 14px;border-radius:12px;margin:14px 0;background:var(--green2);color:var(--green);font-size:14px;line-height:1.5}.authNotice.error{background:#fae9e5;color:#863f35}.authDisclaimer{font-size:12px!important;line-height:1.5;color:var(--muted);background:#f5f0e7;border-radius:12px;padding:12px;margin-top:16px!important}.accountActions{display:flex;align-items:center;gap:10px}.accountName{font-size:13px;color:var(--muted);font-weight:600}.accountActions button{border:1px solid var(--line);border-radius:20px;padding:9px 13px;background:var(--paper);color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:23px;box-shadow:0 7px 22px rgba(53,43,32,.04)}.status{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.pill{padding:8px 12px;border-radius:18px;background:#f0ece5;color:#655e55;font-size:12px}.pill.active{background:var(--green);color:#fff}
.discussion{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.discussionList{display:grid;gap:12px}.topic{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.topic h3{font:600 18px "Playfair Display";margin:0 0 7px}.topic p{margin:0;color:var(--muted);font-size:13px}.topicFoot{display:flex;gap:15px;margin-top:10px;font-size:12px;color:#8b8277}
textarea,input,select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;width:100%;outline:none}textarea{min-height:100px;resize:vertical}.formrow{display:grid;gap:10px;margin:10px 0}
.review{border-top:1px solid var(--line);padding:15px 0}.review:first-child{border-top:0}.review b{font-size:14px}.review p{color:var(--muted);font-size:13px;line-height:1.55}
.reviewBookHead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.readerReviewText{font:17px/1.7 Georgia,serif;color:var(--ink);margin:15px 0}.emptyReviews{text-align:center;padding:38px 22px}.emptyReviews h3{font:700 23px "Playfair Display";margin:0 0 8px}.emptyReviews p{color:var(--muted);margin:0 auto 18px;max-width:460px}
.profileHero{display:flex;align-items:center;gap:20px;padding:28px;background:linear-gradient(135deg,#fffdf9,#f1e7d7)}.profileAvatar{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#4c765d,#2a4736);color:#fff;font:700 32px "Playfair Display";box-shadow:0 10px 24px rgba(53,88,66,.2)}.profileHero h1{font:700 34px "Playfair Display";margin:0 0 4px}.profileHero p{color:var(--muted);margin:0}.profileStats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.profileStat{text-align:center;padding:20px 12px}.profileStat strong{display:block;color:var(--green);font:700 30px "Playfair Display"}.profileStat span{color:var(--muted);font-size:13px}.profileSectionTitle{font:700 25px "Playfair Display";margin:30px 0 14px}
.reader{display:flex;gap:16px;align-items:center}.readerAvatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dec7a2,#b9975c);font-weight:700;color:#fff}.reader small{color:var(--muted)}
.readerPage{max-width:800px;margin:auto;background:#fffdf8;border:1px solid var(--line);border-radius:20px;padding:45px;box-shadow:var(--shadow)}.readerPage h1{font:700 42px "Playfair Display"}.readerPage h2{font:700 26px "Playfair Display";margin-top:35px}.readerPage p{font:17px/1.9 Georgia,serif;color:#4d463d}.progress{height:7px;background:#e8e1d7;border-radius:10px;overflow:hidden}.progress div{height:100%;width:62%;background:var(--green)}
footer{text-align:center;color:var(--muted);padding:30px;border-top:1px solid var(--line);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(35,30,25,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.open{display:flex}.modalBox{background:var(--paper);max-width:650px;width:100%;max-height:90vh;overflow:auto;border-radius:24px;padding:28px}.close{float:right;border:0;background:none;font-size:24px}
.toast{position:fixed;bottom:25px;right:25px;background:#29251f;color:#fff;padding:13px 18px;border-radius:12px;display:none;z-index:70}.toast.show{display:block}
@media(max-width:900px){.hero,.two,.discussion{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.navlinks{display:none!important}.heroText{padding:38px 28px}}
@media(max-width:700px){.authLayout{grid-template-columns:1fr;margin:10px auto}.authArt{min-height:190px;padding:24px}.authArt h1{font-size:32px}.authForm{padding:28px 22px}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.cover{height:145px;font-size:17px;padding:13px}.hero h1{font-size:43px}.heroArt{min-height:270px}.cardBody{padding:11px}.actions button{padding:7px}.readerPage{padding:25px}.readerPage h1{font-size:34px}.discoverFilters label,.discoverFilters select,.discoverFilters input{width:100%}.discoverCount{margin-left:0}.accountName{display:none}}
</style>

<body>
<header><nav class="nav">
    
<div class="brand">📚 StoryNest</div>
<div class="navlinks" id="navlinks">
<button onclick="home()">Home</button><button onclick="discover()">Discover</button><button onclick="library()">My Library</button><button onclick="profilePage()">My Profile</button><button onclick="reviewsPage()">Reviews</button><button onclick="discussion()">Discussions</button><button onclick="readers()">Readers</button>
</div>
<div class="accountActions" id="accountActions"></div>
</nav></header>

<main id="app"></main>
<footer>StoryNest · Discover • Read • Track • Review • Share • Discuss • Connect</footer>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalBox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const books=[
{id:1,title:"The Garden of Letters",author:"Mira Ellis",genre:"Romance",language:"English",rating:4.8,readers:2400,cover:"c1",image:"https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=1200&q=80",desc:"A tender story about two strangers, old letters, and a garden that keeps their secrets.",reviews:[["Ananya","A beautiful, quiet romance. I loved the letters."],["Rahul","The writing feels warm and intimate."]]},
{id:2,title:"Before the Rain Falls",author:"Elena Rose",genre:"Romance",language:"English",rating:4.7,readers:1860,cover:"c2",image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80",desc:"When two old friends meet again, unfinished conversations begin to change everything.",reviews:[["Nila","Soft, emotional and very easy to get lost in."],["Aarav","One of my favourite romantic reads this month."]]},
{id:3,title:"The House at Midnight",author:"Iris Vale",genre:"Mystery",language:"English",rating:4.6,readers:1720,cover:"c3",image:"https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1200&q=80",desc:"A forgotten house, a locked room, and a diary that should never have been found.",reviews:[["Maya","The mystery kept me guessing."],["Dev","Atmospheric and addictive."]]},
{id:4,title:"Letters from Elsewhere",author:"Jon Bell",genre:"Adventure",language:"English",rating:4.5,readers:1210,cover:"c4",image:"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80",desc:"A travelling writer follows a trail of letters across villages, mountains and forgotten roads.",reviews:[["Sara","Wonderful sense of place."],["Vishnu","A comforting adventure."]]}
];
const genres=["Adventure","Biography","Children's","Contemporary Fiction","Crime","Dystopian","Drama","Fantasy","Folklore","Graphic Novel","Historical Fiction","Horror","Humor","Inspirational","Literary Fiction","Memoir","Mystery","Mythology","Poetry","Romance","Science Fiction","Self-help","Short Stories","Thriller","Travel","Young Adult"];
const languages=["Assamese","Bengali","Bodo","Dogri","English","Gujarati","Hindi","Kannada","Kashmiri","Konkani","Maithili","Malayalam","Manipuri","Marathi","Nepali","Odia","Punjabi","Sanskrit","Santali","Sindhi","Tamil","Telugu","Urdu"];
let state={status:{},likes:[],reviews:[]};
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
const SUPABASE_URL="https://gxblvowllzvplittcvri.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_b1UhJzgGl2lqPPOQsR1bLg_Cq1d_bsv";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentUser=null;
function showAuthNotice(message,isError=false){let notice=document.getElementById("authNotice");if(notice){notice.textContent=message;notice.className=`authNotice${isError?" error":""}`;notice.hidden=!message}}


function browseHome(){updateHeader();home()}
function statusKey(id){return String(id)}
async function dbReviewsPage(){let {data,error}=await supabaseClient.from("reviews").select("id,book_id,content,created_at,profiles(display_name)").order("created_at",{ascending:false});if(error){console.error("Could not load reviews",error);document.getElementById("app").innerHTML=`<section><div class="panel authNotice error">Reviews could not be loaded: ${escapeHTML(error.message)}</div></section>`;return}let entries=data||[];document.getElementById("app").innerHTML=`<section><div class="sectionHead"><h2>Reader Reviews</h2><span>${entries.length} ${entries.length===1?"review":"reviews"} shared by readers</span></div>${entries.length?`<div class="discussionList">${entries.map(review=>{let book=books.find(item=>item.id===Number(review.book_id));if(!book)return "";return `<article class="panel"><div class="reviewBookHead"><b>${escapeHTML(book.title)}</b><span class="author">by ${escapeHTML(book.author)} · ${escapeHTML(book.genre)}</span></div><p class="readerReviewText">“${escapeHTML(review.content)}”</p><div class="topicFoot"><span>✍ ${escapeHTML(review.profiles?.display_name||"Reader")}</span><span>${escapeHTML(new Date(review.created_at).toLocaleDateString())}</span></div></article>`}).join("")}</div>`:`<div class="panel emptyReviews"><h3>No reader reviews yet</h3><p>Open a book and share your thoughts. Your review will appear here for readers to discover.</p><button class="btn primary" onclick="discover()">Discover books</button></div>`}</section>`}
async function dbProfilePage(){if(!currentUser)return renderAuth("login","Please log in to view your profile.");let {data:reviewRows,error}=await supabaseClient.from("reviews").select("id,book_id,content,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false});if(error){console.error("Could not load profile reviews",error);toast("Profile reviews could not be loaded: "+error.message);reviewRows=[]}let counts={"Currently Reading":0,"Finished Reading":0,"Want to Read":0};Object.values(state.status).forEach(status=>{if(Object.prototype.hasOwnProperty.call(counts,status))counts[status]++});let name=currentUser.user_metadata?.display_name||currentUser.email?.split("@")[0]||"StoryNest Reader";document.getElementById("app").innerHTML=`<section><div class="panel profileHero"><div class="profileAvatar" aria-hidden="true">${escapeHTML(name.trim().charAt(0).toUpperCase())}</div><div><div class="eyebrow">Reader profile</div><h1>${escapeHTML(name)}</h1><p>${escapeHTML(currentUser.email||"")}</p></div></div><div class="profileStats"><div class="panel profileStat"><strong>${counts["Currently Reading"]}</strong><span>Currently reading</span></div><div class="panel profileStat"><strong>${counts["Finished Reading"]}</strong><span>Books finished</span></div><div class="panel profileStat"><strong>${counts["Want to Read"]}</strong><span>Want to read</span></div><div class="panel profileStat"><strong>${reviewRows.length}</strong><span>Reviews written</span></div></div><h2 class="profileSectionTitle">My recent reviews</h2>${reviewRows.length?`<div class="discussionList">${reviewRows.map(review=>{let book=books.find(item=>item.id===Number(review.book_id));if(!book)return "";return `<article class="panel"><div class="reviewBookHead"><b>${escapeHTML(book.title)}</b><span class="author">by ${escapeHTML(book.author)}</span></div><p class="readerReviewText">“${escapeHTML(review.content)}”</p><div class="topicFoot"><span>${escapeHTML(new Date(review.created_at).toLocaleDateString())}</span></div></article>`}).join("")}</div>`:`<div class="panel emptyReviews"><p>You have not written any reviews yet.</p><button class="btn primary" onclick="discover()">Find a book to review</button></div>`}</section>`}
async function dbAddReview(id){let text=document.getElementById("reviewText").value.trim();if(!text)return toast("Write something first.");if(!currentUser){closeModal();return renderAuth("login","Please log in to post a review.")}let {error}=await supabaseClient.from("reviews").insert({user_id:currentUser.id,book_id:id,content:text});if(error){console.error("Could not save review",error);return toast("Review was not saved: "+error.message)}toast("Review added!");closeModal()}
async function dbSetStatus(id,status){if(!currentUser){return renderAuth("login","Please log in to save your reading list.")}state.status[statusKey(id)]=status;await save();toast(`Added to ${status}`);if(document.getElementById("app").innerText.includes("My Library"))library();if(document.getElementById("app").innerText.includes("Reader profile"))dbProfilePage()}
async function dbRead(id){let book=books.find(item=>item.id===id);if(!book)return;if(!currentUser)return renderAuth("login","Please log in to save your reading progress.");state.status[statusKey(id)]="Currently Reading";await save();document.getElementById("app").innerHTML=`<section><div class="readerPage"><button class="btn soft" onclick="details(${id})">Book Details</button><div class="eyebrow" style="margin-top:30px">${escapeHTML(book.genre)} · ${escapeHTML(book.author)}</div><h1>${escapeHTML(book.title)}</h1><div class="progress"><div></div></div><p style="font-family:'DM Sans';font-size:12px;color:var(--muted)">Chapter 8 of 13 · 62% complete</p><h2>Chapter Eight — The Letter</h2><p>The rain had been falling since morning, soft enough to sound like a whisper against the old windows. Mira opened the drawer beneath the desk and found a letter she had never seen before.</p><p>There are stories we read because someone recommends them, and there are stories that seem to find us at exactly the right moment. This was one of those stories.</p><p>She unfolded the paper carefully. The first line made her stop:</p><p><i>“If you are reading this, then you finally found the garden.”</i></p><p>For a moment, everything outside the room disappeared. There was only the letter, the rain, and the feeling that the past had quietly opened a door.</p><div style="display:flex;justify-content:space-between;margin-top:35px"><button class="btn outline">← Previous</button><button class="btn primary" onclick="toast('Chapter completed!')">Next Chapter →</button></div></div></section>`}

function authRedirectUrl(){return window.location.protocol==="file:"?null:window.location.href.split(/[?#]/)[0]}
function renderAuth(mode="login",notice="",isError=false){let app=document.getElementById("app");let login=mode==="login";let register=mode==="register";let forgot=mode==="forgot";let recovery=mode==="recovery";let title=login?"Welcome back":register?"Join StoryNest":forgot?"Reset your password":"Choose a new password";let description=login?"Sign in to continue your reading journey.":register?"Create an account and find your next favourite story.":forgot?"We’ll email you a secure password reset link.":"Your reset link is verified. Choose a new password.";let fields=login?`<div class="formrow"><label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" autocomplete="email" required></div><div class="formrow"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div>`:register?`<div class="formrow"><label for="registerName">Your name</label><input id="registerName" name="name" autocomplete="name" required maxlength="60"></div><div class="formrow"><label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" autocomplete="email" required></div><div class="formrow"><label for="registerPassword">Password (at least 8 characters)</label><input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="formrow"><label for="registerConfirm">Confirm password</label><input id="registerConfirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div>`:forgot?`<div class="formrow"><label for="resetEmail">Registered email</label><input id="resetEmail" name="email" type="email" autocomplete="email" required></div>`:`<div class="formrow"><label for="newPassword">New password (at least 8 characters)</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="formrow"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div>`;let action=login?"loginUser(event)":register?"registerUser(event)":forgot?"requestPasswordReset(event)":"handlePasswordReset(event)";let button=login?"Log in":register?"Create account":forgot?"Send reset link":"Save new password";app.innerHTML=`<section class="authLayout"><div class="authArt"><h1>Every story begins somewhere.</h1><p>Settle in, turn a page, and find a world that feels like yours.</p></div><div class="authForm"><h2>${title}</h2><p>${description}</p><div id="authNotice" class="authNotice" ${notice?"":"hidden"}>${escapeHTML(notice)}</div><form onsubmit="${action}">${fields}<button class="btn primary" type="submit">${button}</button></form><div class="authLinks">${login?`<button class="textButton" onclick="renderAuth('forgot')">Forgot password?</button><button class="textButton" onclick="renderAuth('register')">Create account</button><button class="textButton" onclick="browseHome()">Go to home</button>`:register||forgot||recovery?`<button class="textButton" onclick="renderAuth('login')">Back to log in</button>`:`<button class="textButton" onclick="renderAuth('login')">Back to log in</button>`}</div>${forgot?`<p class="authDisclaimer">Password reset email will be sent by Supabase. Add this site’s URL to Supabase Authentication → URL Configuration → Redirect URLs.</p>`:""}</div></section>`;updateHeader();if(notice)showAuthNotice(notice,isError)}
function authErrorMessage(error, action) {

  if (action === "login") {

    if (error.code === "email_not_confirmed") {
      return "Please confirm your email before logging in.";
    }

    if (
      error.code === "invalid_credentials" ||
      error.code === "user_not_found"
    ) {
      return "Invalid email or password.";
    }
  }

  if (
    action === "register" &&
    error.code === "user_already_exists"
  ) {
    return "An account already exists for this email. Please log in.";
  }

  return error.message || `Could not ${action}. Please try again.`;
}
async function registerUser(event){event.preventDefault();let form=event.currentTarget;let name=form.elements.name.value.trim();let email=form.elements.email.value.trim();let password=form.elements.password.value;if(password!==form.elements.confirm.value)return showAuthNotice("Passwords do not match.",true);try{let options={data:{display_name:name}};let redirectUrl=authRedirectUrl();if(redirectUrl)options.emailRedirectTo=redirectUrl;let {data,error}=await supabaseAuth.signUp({email,password,options});if(error)throw error;if(data.session){let {error:signOutError}=await supabaseAuth.signOut();if(signOutError){console.error("Could not sign out after registration",signOutError);renderAuth("login","Registration successful, but automatic sign-out failed. Please log out before signing in.",true);return}currentUser=null}renderAuth("login","Registration successful! Please log in to continue.")}catch(error){if(error.code!=="user_already_exists")console.error("Supabase registration failed",error);showAuthNotice(authErrorMessage(error,"register"),true)}}
async function loginUser(event){event.preventDefault();let form=event.currentTarget;try{let {data,error}=await supabaseAuth.signInWithPassword({email:form.elements.email.value.trim(),password:form.elements.password.value});if(error)throw error;currentUser=data.user;await loadUserData();updateHeader();home()}catch(error){if(error.code!=="invalid_credentials"&&error.code!=="email_not_confirmed")console.error("Supabase sign-in failed",error);showAuthNotice(authErrorMessage(error,"login"),true)}}
async function requestPasswordReset(event){event.preventDefault();let email=event.currentTarget.elements.email.value.trim();try{let options={};let redirectUrl=authRedirectUrl();if(redirectUrl)options.redirectTo=redirectUrl;let {error}=await supabaseAuth.resetPasswordForEmail(email,options);if(error)throw error;renderAuth("login",`If an account exists for that email, Supabase will send a password reset link.${redirectUrl?"":" Open this app through a web server and allow its URL in Supabase Redirect URLs for the reset link to return to the password form."}`)}catch(error){console.error("Supabase reset email failed",error);showAuthNotice(error.message||"Could not send the password reset email.",true)}}
async function handlePasswordReset(event){event.preventDefault();let form=event.currentTarget;let password=form.elements.password.value;if(password!==form.elements.confirm.value)return showAuthNotice("Passwords do not match.",true);if(!passwordRecoveryPending&&!currentUser)return showAuthNotice("Open the password reset link from your email before choosing a new password.",true);try{let {error}=await supabaseAuth.updateUser({password});if(error)throw error;passwordRecoveryPending=false;await supabaseAuth.signOut();currentUser=null;renderAuth("login","Password updated successfully. Please log in with your new password.")}catch(error){console.error("Supabase password update failed",error);showAuthNotice(error.message||"Could not update your password.",true)}}
async function logout(){try{let {error}=await supabaseAuth.signOut();if(error)throw error;currentUser=null;state={status:{},likes:[],reviews:[]};renderAuth("login","You have been logged out.")}catch(error){console.error("Supabase sign-out failed",error);toast(error.message||"Could not log out.")}}
async function loadUserData(){if(!currentUser){state={status:{},likes:[],reviews:[]};return}let {data,error}=await supabaseClient.from("reading_progress").select("book_id,status").eq("user_id",currentUser.id);if(error){console.error("Could not load reading progress",error);toast("Reading progress could not be loaded: "+error.message);return}state.status=Object.fromEntries(data.map(row=>[String(row.book_id),row.status]));state.likes=[];state.reviews=[]}

async function initializeApp(){supabaseAuth.onAuthStateChange((event,session)=>{currentUser=session?.user||null;if(event==="PASSWORD_RECOVERY"){passwordRecoveryPending=true;renderAuth("recovery")}else if(event==="SIGNED_OUT"){passwordRecoveryPending=false;renderAuth("login")}updateHeader()});let recoveryLink=window.location.hash.includes("type=recovery")||new URLSearchParams(window.location.search).get("type")==="recovery";if(recoveryLink){passwordRecoveryPending=true;renderAuth("recovery");return}let {data,error}=await supabaseAuth.getSession();if(error){console.error("Supabase session restore failed",error);renderAuth("login","Could not connect to your account. Please try again.",true);return}currentUser=data.session?.user||null;if(currentUser){await loadUserData();updateHeader();home()}else renderAuth("login")}

function readers(){document.getElementById("app").innerHTML=`<section><div class="sectionHead"><h2>Readers</h2><span>Find people who love books like you</span></div><div class="grid">${["Ananya","Rahul","Maya","Vishnu"].map((n,i)=>`<div class="panel"><div class="reader"><div class="readerAvatar">${n[0]}</div><div><b>${n}</b><small>@${n.toLowerCase()}_reads</small></div></div><p style="color:var(--muted);font-size:13px">${12+i*7} books read · ${3+i} reviews</p><button class="btn soft" onclick="toast('Following ${n}')">Follow Reader</button></div>`).join("")}</div></section>`}
function closeModal(){document.getElementById("modal").classList.remove("open")}
reviewsPage=dbReviewsPage;
profilePage=dbProfilePage;
addReview=dbAddReview;
setStatus=dbSetStatus;

discussion=dbDiscussion;

initializeApp();
